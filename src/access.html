<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zendir | Space Cyber Garage Access</title><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#0e0f14;color:#fff}.access{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at top right,#1b2da0,transparent 65%)}.card{width:min(100%,440px);padding:34px;border:1px solid #9d70ff65;border-radius:18px;background:#f7f7fb;color:#0e0f14;box-shadow:0 20px 100px #0006}.brand{background:#0e0f14;border-radius:8px;padding:12px;display:inline-block}.brand img,.session-bar img{filter:invert(1)}.brand img{display:block;width:183px;height:auto}h1{font-size:28px;line-height:1.2;margin:22px 0 10px}.eyebrow{color:#1b2da0;letter-spacing:2px;font-size:10px;font-weight:700}label{display:block;font-size:13px;margin:16px 0 6px;font-weight:600}input,button{font:inherit;width:100%;padding:12px;border-radius:8px}input{border:1px solid #bdb6cf;background:#fff}input:focus-visible,button:focus-visible{outline:3px solid #9d70ff;outline-offset:3px}button{background:#3e3cff;color:#fff;border:0;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}.small{font-size:12px;color:#514964}.error{min-height:24px;color:#9f2828;font-size:13px}#session{display:none;height:100vh}#session.active{display:flex;flex-direction:column}.session-bar{display:flex;align-items:center;gap:16px;padding:8px 16px;background:#0e0f14;font-size:12px}.session-bar img{width:100px;height:auto}.session-bar button{width:auto;margin:0 0 0 auto;padding:6px 15px;background:#1b2da0}.session-bar span{overflow-wrap:anywhere}iframe{border:0;flex:1;width:100%;background:#f7f7fb}body:has(#session.active) .access{display:none}[hidden]{display:none!important}@media(max-width:500px){.access{padding:16px}.card{padding:24px}.session-bar{gap:8px}.session-bar img{width:70px}}
</style></head><body><main class="access" id="access"><section class="card"><div class="brand"><img src="__ZENDIR_LOGO__" alt="Zendir"></div><p class="eyebrow">SPACE CYBER GARAGE</p><h1>Sign in to rehearse the mission.</h1><p>Use your listed email address and the shared demo password.</p><form id="login"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="unlock" type="submit">Open simulator</button><p id="error" class="error" role="status" aria-live="polite"></p></form><p class="small">This shared-password gate does not verify email ownership. Use it for this synthetic demonstration only.</p></section></main><section id="session"><header class="session-bar"><img src="__ZENDIR_LOGO__" alt="Zendir"><span>Space Cyber Garage</span><span id="session-email"></span><button id="lock">Lock simulator</button></header><iframe id="simulator" title="Zendir Space Cyber Garage" sandbox="allow-scripts allow-downloads allow-modals"></iframe></section><script>
const bundle=/* ENCRYPTED_PAYLOAD */;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),encoder=new TextEncoder();
async function derive(password,email){const raw=await crypto.subtle.importKey('raw',encoder.encode(password+'\0'+email),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(bundle.salt),iterations:600000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('unlock'),password=document.getElementById('password'),error=document.getElementById('error');button.disabled=true;error.textContent='Opening demo…';try{if(!crypto.subtle)throw Error('Secure browser required');const email=document.getElementById('email').value.trim().toLowerCase();const digest=new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(email)));const id=Array.from(digest,b=>b.toString(16).padStart(2,'0')).join('');const wrapped=bundle.users[id];if(!wrapped)throw Error('Unknown login');const key=await derive(password.value,email);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(wrapped.iv)},key,bytes(wrapped.data));const contentKey=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const content=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(bundle.iv)},contentKey,bytes(bundle.data));document.getElementById('simulator').srcdoc=new TextDecoder().decode(content);document.getElementById('session-email').textContent=email;document.getElementById('session').classList.add('active');password.value='';error.textContent='';document.getElementById('lock').focus();}catch(err){error.textContent='Unable to open the demo. Check your email address and password.';}finally{password.value='';button.disabled=false;}});
document.getElementById('lock').addEventListener('click',()=>{document.getElementById('simulator').srcdoc='';document.getElementById('session').classList.remove('active');document.getElementById('session-email').textContent='';document.getElementById('email').focus();});
</script></body></html>
